name: 'Enterprise Python CI/CD Pipeline'

# ==============================================================================
# Enterprise GitHub Actions Workflow - ai-cloud-sre-mcp-agent
# Author: Gunjan Kumar Gaurav (Senior Cloud & DevSecOps Consultant)
# ==============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test-and-lint:
    name: '1. Test & Security Quality Gates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest bandit

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Bandit Security Vulnerability Audit
        run: bandit -r . -f custom --exit-zero

      - name: Execute Tests
        run: |
          if [ -d tests ] || [ -f test_*.py ]; then
            pytest
          else
            echo "No test suite directory found, syntax validation passed."
          fi
